function T(x,y,s,c,anc,p){const e=E('text',{x,y,class:c||'ts','text-anchor':anc||'middle','dominant-baseline':'central'},p);e.textContent=s;return e}

E('line',{x1:f1(x),y1:y0+2,x2:f1(x),y2:f1(y0+tl),stroke:C.g,'stroke-opacity':.3,'stroke-width':1},g);E('line',{x1:f1(x),y1:y1-2,x2:f1(x),y2:f1(y1-tl),stroke:C.g,'stroke-opacity':.3,'stroke-width':1},g);
E('circle',{cx:f1(x),cy:y0,r:2.6,fill:C.g,'fill-opacity':.45},g);E('circle',{cx:f1(x),cy:y1,r:2.6,fill:C.g,'fill-opacity':.45},g)}return g}

E('rect',{x:-8.5,y:-h,width:17,height:L,rx:8.5,fill:C.rec,'fill-opacity':.14},g);
const n=Math.max(2,Math.round(L/5.3)),st=L/n,A=6.6,bk=E('g',{},g),fr=E('g',{},g);

const front=k%2===1;E('polyline',{points:J(pts),fill:'none',stroke:front?C.rec:C.recD,'stroke-width':front?4.4:2.8,'stroke-opacity':front?1:.55,'stroke-linecap':'round'},front?fr:bk)}

{d:17.08,t:'Digestion releases thousands of peptides',n:'Babies fed human milk tend to have fewer gut problems. Digestion breaks that milk into thousands of tiny peptides. We’ve catalogued about 14,500 of them, yet what most of them do is still largely unexplored.',b(){

const ar=E('g',{opacity:0});E('line',{x1:318,y1:180,x2:372,y2:180,class:'arr','marker-end':'url(#arrow)'},ar);T(345,162,'Digestion','ts','middle',ar);
const q=T(520,168,'?','th');q.setAttribute('style','font-size:96px;font-weight:500');q.setAttribute('fill',C.g);

fr.forEach((f,i)=>{const k=sg(t,4.5+i*.1,6.5+i*.1);f.g.setAttribute('transform',`translate(${f1(f.dx*k)},${f1(f.dy*k)})`);op(f.g,1-.6*sg(t,12.4,13.2))});
const u=sg(t,12.4,13.4);op(q,u*.22);
dots.forEach(d=>{const o=cl((t-d.a)/.3);d.c.setAttribute('opacity',(o*(d.k?.85:.65-.4*u)).toFixed(2));d.c.setAttribute('fill',d.k||u<.5?C.pep:C.g)});
n1.textContent=t>9?Math.round(14500*sg(t,9.1,11.4)).toLocaleString()+' peptide sequences':'';n2.textContent=t>12.6?'What most of them do: largely unexplored':''}}},

const pick=grid[13],px=+pick.getAttribute('cx'),py=+pick.getAttribute('cy');

{d:11.45,t:'Too many pairs to test at the bench',n:'Any one of them could be talking to any of 204 receptors in the gut. That’s around 3 million pairs, far too many to test one at a time at the bench.',b(){

E('line',{x1:24,y1:198,x2:384,y2:198,style:'stroke:var(--border)','stroke-width':.5});
