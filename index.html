const synth=('speechSynthesis' in window)?window.speechSynthesis:null;let voice=null;
const GB_MALE=/Google UK English Male|Daniel|Arthur|Oliver|Ryan|George|Thomas|Alfie|Elliot|Noah|Ethan|male/i,GB_FEMALE=/female|Libby|Sonia|Maisie|Hazel|Susan|Kate|Serena|Stephanie|Martha|Fiona|Moira/i;
function vscore(v){const gb=/en[-_]GB/i.test(v.lang);if(/Google UK English Male/i.test(v.name))return 100;if(gb&&GB_MALE.test(v.name)&&!GB_FEMALE.test(v.name))return 80;if(gb&&!GB_FEMALE.test(v.name))return 50;if(gb)return 30;if(/^en/i.test(v.lang))return 10;return 0}
const DBG=/[?&]voices/.test(location.search),dbgEl=document.getElementById('dbg'),dbgLog=[];
function dbg(m){if(!DBG)return;if(m)dbgLog.push(new Date().toLocaleTimeString()+'  '+m);dbgEl.hidden=false;const all=synth?synth.getVoices():[];dbgEl.textContent='Selected voice: '+(voice?voice.name+' ('+voice.lang+')':'none yet')+'\nVoices in this browser: '+all.length+'\n'+all.filter(v=>/^en/i.test(v.lang)).map(v=>'  '+vscore(v)+'  '+v.name+' ('+v.lang+')'+(v.localService?'':' [online]')).join('\n')+'\n\nEvents:\n'+dbgLog.join('\n')}
function loadVoices(){if(!synth)return;const vs=synth.getVoices().filter(v=>/^en/i.test(v.lang)).sort((a,b)=>vscore(b)-vscore(a));voice=vs[0]||null;dbg('voices loaded')}
if(synth){loadVoices();synth.onvoiceschanged=()=>{loadVoices();if(voice&&wv){wv=false;if(playing&&narr)speak()}}}
let wv=false,wt=false,si=0,el=0,playing=false,ended=false,narr=!!synth,done=true,utt=null,last=performance.now(),tick=()=>{};
function speak(){if(!synth){done=true;return}if(!voice)loadVoices();synth.cancel();if(!narr||!playing){done=true;return}
if(!voice&&!wt){wv=true;wt=true;done=false;setTimeout(()=>{if(wv){wv=false;if(playing&&narr)speak()}},2000);return}
const u=new SpeechSynthesisUtterance(S[si].n.replace(/3D/g,'3-D'));if(voice){u.voice=voice;u.lang=voice.lang}u.rate=.95;u.pitch=1;done=false;u.onend=()=>{if(utt===u)done=true};u.onerror=e=>{dbg('ERROR '+(e&&e.error)+' with '+(u.voice?u.voice.name:'default voice'));if(utt===u)done=true};u.onstart=()=>dbg('speaking with '+(u.voice?u.voice.name:'BROWSER DEFAULT'));utt=u;synth.speak(u)}
const dots=document.getElementById('dots'),bar=document.getElementById('bar'),db=[];
S.forEach((s,i)=>{const b=document.createElement('button');b.setAttribute('aria-label','Go to scene '+(i+1));b.style.cssText='width:10px;height:10px;min-width:0;min-height:0;padding:0;border-radius:50%;border:none;cursor:pointer';b.onclick=()=>{ended=false;load(i);ui()};dots.appendChild(b);db.push(b)});
function load(i){si=(i+S.length)%S.length;stage.innerHTML='';tick=S[si].b();el=playing?0:(si===0&&!ended?0:S[si].d-.01);
document.getElementById('capk').textContent='Scene '+(si+1)+' of '+S.length;document.getElementById('capt').textContent=S[si].t;document.getElementById('caps').textContent=S[si].n;
db.forEach((b,j)=>b.style.background=j===si?'var(--text-primary)':'var(--border-strong)');speak()}
function ui(){document.getElementById('pi').className='ti '+(playing?'ti-player-pause':ended?'ti-reload':'ti-player-play');document.getElementById('pl').textContent=playing?'Pause':ended?'Replay':(si===0&&el<.05?'Play with narration':'Resume')}
function setPlay(p){playing=p;if(p){if(ended){ended=false;load(0)}else load(si)}else{if(synth)synth.cancel();done=true}ui()}
document.getElementById('play').onclick=()=>setPlay(!playing);
document.getElementById('prev').onclick=()=>{ended=false;load(si-1);ui()};
document.getElementById('next').onclick=()=>{ended=false;load(si+1);ui()};
document.getElementById('vol').onclick=()=>{narr=!narr&&!!synth;document.getElementById('vi').className='ti '+(narr?'ti-volume':'ti-volume-off');document.getElementById('vol').setAttribute('aria-label',narr?'Turn narration off':'Turn narration on');if(!narr){if(synth)synth.cancel();done=true}};
if(!synth){document.getElementById('vi').className='ti ti-volume-off'}
load(0);ui();
function fr(now){const dt=Math.min(.1,(now-last)/1000);last=now;
if(playing){el+=dt;const d=S[si].d;if(el>=d&&(done||!narr||el>d+10)){if(si===S.length-1){ended=true;playing=false;ui()}else load(si+1)}}
tick(reduce?S[si].d:el);bar.style.width=(cl(el/S[si].d)*100).toFixed(1)+'%';requestAnimationFrame(fr)}
requestAnimationFrame(fr);
</script>
</body>
</html>
